# GitHub Actions CI — SERA-CTRL-01
# Rulează la fiecare push/PR pe main și develop
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend — Lint + Teste
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: sera_test
          POSTGRES_USER: sera
          POSTGRES_PASSWORD: sera_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json
      - run: cd backend && npm ci
      - run: cd backend && npm run lint --if-present
      - run: cd backend && npm test --if-present
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: sera_test
          DB_USER: sera
          DB_PASSWORD: sera_test_password
          JWT_SECRET: test_secret_only
          NODE_ENV: test

  mobile-lint:
    name: Mobile — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package.json
      - run: cd mobile && npm ci
      - run: cd mobile && npm run lint --if-present

  firmware-build:
    name: Firmware — PlatformIO Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio
      - run: cd firmware/etapa1 && pio run
      - run: cd firmware/etapa2 && pio run

  docker-compose-validate:
    name: Docker Compose — Validare sintaxă
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f infrastructure/docker-compose.monitoring.yml config --quiet
