; ============================================================
; SERA INTELIGENTA - ETAPA 1
; Fișier: platformio.ini
; Descriere: Configurare PlatformIO pentru ESP32
; ============================================================

[env:esp32dev]
platform    = espressif32
board       = esp32dev
framework   = arduino

; Viteză serial monitor
monitor_speed = 115200

; Filtre serial monitor utile
monitor_filters = esp32_exception_decoder, colorize

; Librării necesare în Etapa 1
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; Flags compilare - activăm warnings
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall

; Upload settings (ajustează portul COM)
; upload_port = COM3          ; Windows
; upload_port = /dev/ttyUSB0  ; Linux
; upload_port = /dev/cu.usbserial-* ; macOS


