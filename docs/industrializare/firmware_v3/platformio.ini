; =============================================================
; SERA INTELIGENTA v3.0 — Firmware PRODUCTIE
; Target: ESP32-WROOM-32E-N8 (8MB) pe PCB custom SERA-CTRL-01
; =============================================================
[env:sera_ctrl_v1]
platform        = espressif32
board           = esp32dev
framework       = arduino
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed   = 115200
monitor_filters = colorize, esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DFIRMWARE_VERSION_MAJOR=3
    -DFIRMWARE_VERSION_MINOR=0
    -DFIRMWARE_VERSION_PATCH=0
    -DHW_REVISION=\"SERA-CTRL-01-revA\"

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.5
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    adafruit/Adafruit BusIO @ ^1.16.1

; PRODUCTIE: activati Secure Boot v2 + Flash Encryption inainte de livrare.
; Pasii sunt IREVERSIBILI per cip — vezi docs/secure_boot_procedure.md
