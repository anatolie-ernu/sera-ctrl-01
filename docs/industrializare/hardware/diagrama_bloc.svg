<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Arial">
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker>
</defs>
<rect width="900" height="560" fill="#fafcfa"/>
<text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e2e">SERA-CTRL-01 rev A — Diagramă Bloc</text>

<!-- Zona 230V -->
<rect x="20" y="50" width="250" height="470" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,3"/>
<text x="145" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">⚡ ZONĂ 230V AC</text>

<rect x="40" y="95" width="210" height="60" rx="6" fill="#fff" stroke="#c0392b"/>
<text x="145" y="118" text-anchor="middle" font-size="12" font-weight="bold">Intrare AC: J1 (L/N)</text>
<text x="145" y="136" text-anchor="middle" font-size="11">F1 2A T → RV1 MOV 470V</text>

<rect x="40" y="175" width="210" height="60" rx="6" fill="#fff" stroke="#c0392b"/>
<text x="145" y="198" text-anchor="middle" font-size="12" font-weight="bold">PS1: HLK-10M05</text>
<text x="145" y="216" text-anchor="middle" font-size="11">AC-DC izolat → 5V / 2A</text>

<rect x="40" y="265" width="210" height="230" rx="6" fill="#fff" stroke="#c0392b"/>
<text x="145" y="288" text-anchor="middle" font-size="12" font-weight="bold">Relee K1–K5 (HF115F 12A)</text>
<text x="145" y="310" text-anchor="middle" font-size="11">K1 Fereastră 1 + snubber RC</text>
<text x="145" y="330" text-anchor="middle" font-size="11">K2 Fereastră 2 + snubber RC</text>
<text x="145" y="350" text-anchor="middle" font-size="11">K3 Electrovalvă apă</text>
<text x="145" y="370" text-anchor="middle" font-size="11">K4 Ventilator 1</text>
<text x="145" y="390" text-anchor="middle" font-size="11">K5 Ventilator 2</text>
<text x="145" y="420" text-anchor="middle" font-size="11" fill="#666">Terminale J3–J7</text>
<text x="145" y="440" text-anchor="middle" font-size="11" fill="#666">COM / NO / NC</text>
<text x="145" y="475" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">Creepage ≥ 6.4mm + sloturi</text>

<!-- Bariera -->
<line x1="285" y1="50" x2="285" y2="520" stroke="#c0392b" stroke-width="3" stroke-dasharray="10,5"/>
<text x="285" y="540" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">BARIERĂ IZOLARE GALVANICĂ</text>

<!-- Zona SELV -->
<rect x="305" y="50" width="370" height="470" rx="10" fill="#eaf4ec" stroke="#1f6e3a" stroke-width="2"/>
<text x="490" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f6e3a">ZONĂ SELV (3.3V / 5V)</text>

<rect x="325" y="95" width="150" height="55" rx="6" fill="#fff" stroke="#1f6e3a"/>
<text x="400" y="117" text-anchor="middle" font-size="12" font-weight="bold">U2: ME6217</text>
<text x="400" y="135" text-anchor="middle" font-size="11">LDO 5V→3.3V 800mA</text>

<rect x="325" y="180" width="330" height="120" rx="6" fill="#fff" stroke="#1f6e3a" stroke-width="2"/>
<text x="490" y="205" text-anchor="middle" font-size="13" font-weight="bold">U1: ESP32-WROOM-32E-N8</text>
<text x="490" y="225" text-anchor="middle" font-size="11">8MB flash — OTA A/B · pre-certificat RED/FCC</text>
<text x="490" y="245" text-anchor="middle" font-size="11">Secure Boot v2 + Flash Encryption</text>
<text x="490" y="265" text-anchor="middle" font-size="11">BOOT/RESET · LED-uri PWR/WiFi/ST</text>
<text x="490" y="285" text-anchor="middle" font-size="10" fill="#666">Antenă: keep-out cupru, la marginea PCB</text>

<rect x="325" y="330" width="150" height="55" rx="6" fill="#fff" stroke="#1f6e3a"/>
<text x="400" y="352" text-anchor="middle" font-size="12" font-weight="bold">U4: ULN2003A</text>
<text x="400" y="370" text-anchor="middle" font-size="11">Driver bobine relee</text>

<rect x="505" y="330" width="150" height="55" rx="6" fill="#fff" stroke="#1f6e3a"/>
<text x="580" y="352" text-anchor="middle" font-size="12" font-weight="bold">U3: CP2102N</text>
<text x="580" y="370" text-anchor="middle" font-size="11">USB-C programare</text>

<rect x="325" y="415" width="330" height="85" rx="6" fill="#fff" stroke="#1f6e3a"/>
<text x="490" y="438" text-anchor="middle" font-size="12" font-weight="bold">Interfețe senzori protejate (TVS + RC)</text>
<text x="490" y="458" text-anchor="middle" font-size="11">I2C → SHT31 (J8, M12) · pull-up 4.7k · PESD3V3</text>
<text x="490" y="476" text-anchor="middle" font-size="11">ADC GPIO34 → sol capacitiv (J9) · 1k + 100nF</text>
<text x="490" y="494" text-anchor="middle" font-size="11">U5 MAX3485 → RS485 Modbus (J10) · SM712 · 120Ω</text>

<!-- Senzori externi -->
<rect x="700" y="180" width="180" height="320" rx="10" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
<text x="790" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#b7950b">SENZORI EXTERNI</text>
<rect x="715" y="225" width="150" height="60" rx="6" fill="#fff" stroke="#b7950b"/>
<text x="790" y="248" text-anchor="middle" font-size="11" font-weight="bold">Sondă SHT31</text>
<text x="790" y="266" text-anchor="middle" font-size="10">temp/umid, ±0.2°C, max 3m</text>
<rect x="715" y="305" width="150" height="60" rx="6" fill="#fff" stroke="#b7950b"/>
<text x="790" y="328" text-anchor="middle" font-size="11" font-weight="bold">Sol capacitiv</text>
<text x="790" y="346" text-anchor="middle" font-size="10">analog 0–3V</text>
<rect x="715" y="385" width="150" height="60" rx="6" fill="#fff" stroke="#b7950b"/>
<text x="790" y="408" text-anchor="middle" font-size="11" font-weight="bold">Senzori RS485</text>
<text x="790" y="426" text-anchor="middle" font-size="10">sol industrial Modbus</text>

<!-- Sageti -->
<line x1="145" y1="155" x2="145" y2="175" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<line x1="250" y1="205" x2="325" y2="122" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<text x="295" y="155" font-size="10" fill="#444">5V</text>
<line x1="400" y1="150" x2="400" y2="180" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<text x="410" y="170" font-size="10" fill="#444">3.3V</text>
<line x1="400" y1="300" x2="400" y2="330" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<line x1="325" y1="357" x2="250" y2="357" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<text x="280" y="350" font-size="10" fill="#444">bobine</text>
<line x1="580" y1="300" x2="580" y2="330" stroke="#444" stroke-width="2"/>
<line x1="490" y1="300" x2="490" y2="415" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<line x1="655" y1="255" x2="715" y2="255" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<line x1="655" y1="465" x2="715" y2="340" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
<line x1="655" y1="485" x2="715" y2="415" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
</svg>
