# =============================================================================
# mosquitto_tls.conf — Broker producție: MQTTS cu autentificare per certificat
# =============================================================================
# Înlocuiește mosquitto.conf din development. Pași de instalare:
#   1. Copiați ca/chain.pem din infrastructura CA → /mosquitto/certs/ca_chain.pem
#   2. Emiteți certificat de SERVER pentru broker (CN = sera.domeniultau.md),
#      semnat de același Device CA sau de Let's Encrypt:
#         server.crt + server.key → /mosquitto/certs/
#   3. Actualizați docker-compose: portul 8883, volum ./certs:/mosquitto/certs:ro
#
# Cum funcționează identitatea:
#   • require_certificate true        → clientul TREBUIE să prezinte certificat
#   • use_identity_as_username true   → username = CN-ul certificatului
#       CN = SERA-A1B2C3 (dispozitiv) sau CN = backend (serviciul nostru)
#   • ACL-ul de mai jos restrânge fiecare dispozitiv la topicurile LUI:
#       un dispozitiv compromis nu poate citi/comanda alte sere.
# =============================================================================

# ── Listener intern (doar backend, în rețeaua Docker, fără TLS) ─────────────
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd          # doar contul "backend"

# ── Listener public MQTTS pentru dispozitive ─────────────────────────────────
listener 8883
cafile   /mosquitto/certs/ca_chain.pem
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

# ── ACL ──────────────────────────────────────────────────────────────────────
acl_file /mosquitto/config/acl.conf

# ── Persistență și log ───────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
