# =============================================================================
# acl.conf — Cine ce topicuri poate accesa
# =============================================================================
# %u = username (= CN-ul certificatului pentru listenerul 8883)
#
# DISPOZITIVE: pot publica/abona DOAR sub propriul prefix.
# Pattern-urile se aplică tuturor utilizatorilor neenumerați explicit.
pattern readwrite greenhouse/%u/#

# BACKEND: vede tot (se conectează pe 1883 intern cu user/parolă)
user backend
topic readwrite greenhouse/#
